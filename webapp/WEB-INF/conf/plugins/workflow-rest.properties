################################################################################
# Configuration file for Workflow REST module

# Signature check of the /rest/workflow resources. Leave it on.
# Setting it to false serves every call unchecked, doAction included, which
# executes a workflow action - it exists so TestWorkflowRest.jsp can be driven
# locally, which in v7 meant commenting the <filters> block out of the plugin
# descriptor.
workflow-rest.security.activated=true

# How that check is configured. Read by AbstractSignRequestAuthenticatorProducer
# (library-signrequest) under the prefix workflow-rest.requestAuthenticator.
# Reproduces the v7 descriptor exactly. A name the producer does not know is an
# error, not a way to switch the check off - use the key above for that.
workflow-rest.requestAuthenticator.name=signrequest.HeaderHashAuthenticator
workflow-rest.requestAuthenticator.cfg.hashService=signrequest.Sha1HashService

# Deliberately empty, as in the v7 descriptor: the signature binds the private key
# and the timestamp only, on all four resources. Filling it in would change what
# every client must sign - a contract change, not a fix.
# An empty value reads as an absent key, so this line behaves exactly as omitting
# it would; it is present to document the intent.
# If a multipart endpoint is ever added to this module, a non-empty element list
# would then also need the request wrapper pattern used by module-blobstore-rest.
workflow-rest.requestAuthenticator.cfg.signatureElements=

workflow-rest.requestAuthenticator.cfg.privateKey=change me
